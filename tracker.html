<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Flights — Flight Tracker</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">Flight Tracker</a>
  <button class="menu" aria-label="Open menu" onclick="toggleMenu()">☰</button>
  <nav id="nav">
    <a href="index.html">Home</a>
    <a class="active" href="tracker.html">My Flights</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main class="tracker-page">
  <div class="tracker-head">
    <div>
      <p class="eyebrow">MY FLIGHT LOG</p>
      <h1>Felix's Flights</h1>
    </div>
    <a class="button secondary" href="https://my.flightradar24.com/felixthecatalt1" target="_blank" rel="noopener">Open Original ↗</a>
  </div>

  <div class="fr24-frame-wrap">
    <iframe
      src="https://my.flightradar24.com/felixthecatalt1"
      title="Felix's myFlightradar24 flight profile"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="fullscreen">
    </iframe>
    <div class="frame-fallback">
      <strong>Having trouble loading the profile?</strong>
      <span>Open the original myFlightradar24 page directly.</span>
      <a class="button" href="https://my.flightradar24.com/felixthecatalt1" target="_blank" rel="noopener">Open myFlightradar24</a>
    </div>
  </div>
</main>

<footer>© <span id="year"></span> Flight Tracker</footer>
<script src="assets/app.js"></script>
</body>
</html>
